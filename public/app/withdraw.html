<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - Broker</title>
    
    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="shortcut icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    
    <link rel="stylesheet" href="/assets/css/ui-kit.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/assets/css/ui.css">
    <link rel="stylesheet" href="/assets/css/notifications.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Withdraw Page Specific Styles */
        .withdraw-header {
            background: linear-gradient(135deg, var(--surface) 0%, var(--surface-light) 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
            text-align: center;
        }
        
        .withdraw-header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .withdraw-header p {
            color: var(--text-secondary);
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .withdraw-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .withdraw-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }
        
        .withdraw-card h3 {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .withdraw-card .value {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .withdraw-form {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            background: var(--surface-light);
            color: var(--text-primary);
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn-withdraw {
            width: 100%;
            padding: 14px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-withdraw:hover {
            background: var(--primary-dark);
        }
        
        .btn-withdraw:disabled {
            background: var(--border);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div data-role="app-shell">
        <!-- Sidebar -->
        <aside data-role="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Broker</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/app/home.html" class="nav-item">
                    <span>Dashboard</span>
                </a>
                <a href="/app/portfolio.html" class="nav-item">
                    <span>Portfolio</span>
                </a>
                <a href="/app/convert.html" class="nav-item">
                    <span>Convert</span>
                </a>
                <a href="/app/deposits.html" class="nav-item">
                    <span>Deposits</span>
                </a>
                <a href="/app/withdraw.html" class="nav-item active">
                    <span>Withdraw</span>
                </a>
                <a href="/app/history.html" class="nav-item">
                    <span>History</span>
                </a>
                <a href="/app/settings.html" class="nav-item">
                    <span>Settings</span>
                </a>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <div class="withdraw-header">
                    <h1>Withdraw Funds</h1>
                    <p>Withdraw your funds to your preferred payment method</p>
                </div>
                
                <div class="withdraw-overview">
                    <div class="withdraw-card">
                        <h3>Available USD</h3>
                        <div class="value" id="available-usd">$0</div>
                        <div id="usd-status"></div>
                    </div>
                    <div class="withdraw-card">
                        <h3>Available USDT</h3>
                        <div class="value" id="available-usdt">₮0</div>
                        <div id="usdt-status"></div>
                    </div>
                    <div class="withdraw-card">
                        <h3>Daily Used</h3>
                        <div class="value" id="daily-used">$0</div>
                        <div id="limits-status"></div>
                    </div>
                </div>
                
                <div class="withdraw-form">
                    <div class="form-group">
                        <label for="amount-input">Amount</label>
                        <input type="number" id="amount-input" placeholder="Enter amount" min="0" step="0.01">
                    </div>
                    
                    <div class="form-group">
                        <label for="currency-select">Currency</label>
                        <select id="currency-select">
                            <option value="USD">USD</option>
                            <option value="USDT">USDT</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="method-select">Payout Method</label>
                        <select id="method-select">
                            <option value="">Select Method</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="withdraw-address">Destination Address (if not using saved method)</label>
                        <input type="text" id="withdraw-address" placeholder="Enter destination address">
                    </div>
                    
                    <button class="btn-withdraw" id="btn-withdraw">Withdraw</button>
                </div>
            </div>
        </main>
        
        <!-- Sidebar Overlay -->
        <div data-role="sidebar-overlay" class="sidebar-overlay"></div>
    </div>
    
    <!-- Scripts -->
    <script src="/assets/js/env.js"></script>
    <script src="/assets/js/_shared/theme.js"></script>
    <script src="/assets/js/_shared/modal.js"></script>
    <script src="/assets/js/_shared/toast.js"></script>
    <script src="/assets/js/_shared/skeleton.js"></script>
    <script type="module" src="/assets/js/authStateManager.js"></script>
    <script type="module" src="/assets/js/supabaseClient.js"></script>
    <script type="module" src="/assets/js/auth.js"></script>
    <script type="module" src="/assets/js/authGuard.js"></script>
    <script type="module" src="/assets/js/notify.js"></script>
    <script type="module" src="/assets/js/components.js"></script>
    <script type="module" src="/assets/js/money.js"></script>
    <script type="module" src="/assets/js/api.js"></script>
    <script type="module" src="/assets/js/balance-service.js"></script>
    <script type="module" src="/assets/js/app-shell.js"></script>
    <script type="module" src="/assets/js/pages/app/withdraw.js"></script>
</body>
</html>
